name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          validate-wrappers: false

      - name: Validate signing secrets
        run: |
          missing=""
          [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]    && missing="$missing KEYSTORE_BASE64"
          [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ]  && missing="$missing KEYSTORE_PASSWORD"
          [ -z "${{ secrets.KEY_ALIAS }}" ]           && missing="$missing KEY_ALIAS"
          [ -z "${{ secrets.KEY_PASSWORD }}" ]        && missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Release build cannot proceed. The following repository secrets are missing:$missing"
            echo ""
            echo "To fix this, go to your repository on GitHub:"
            echo "  Settings > Secrets and variables > Actions > New repository secret"
            echo ""
            echo "Add all four secrets listed above. See README.md for keystore generation instructions."
            exit 1
          fi
          echo "All signing secrets are present."

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          echo "Keystore decoded successfully."

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Verify release APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::Release APK was not generated at expected path: $APK"
            exit 1
          fi
          echo "Release APK generated:"
          ls -lh "$APK"
          # Confirm APK is not debuggable
          if aapt dump badging "$APK" 2>/dev/null | grep -q "debuggable='true'"; then
            echo "::error::Release APK is marked debuggable. This is a build configuration error."
            exit 1
          fi
          echo "APK is not debuggable. Build is clean."

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: LOCKIN-Lite-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Build debug APK (testing only)
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LOCKIN-Lite-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
