name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          validate-wrappers: false

      - name: Prepare Release Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from repository secret..."
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          else
            echo "Generating production release signing key in CI runner..."
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias lockin \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass lockin_release_storepass \
              -keypass lockin_release_keypass \
              -dname "CN=LOCKIN, OU=Security, O=LOCKIN App, L=Bangalore, ST=Karnataka, C=IN"
          fi

      - name: Build Production Release APK
        env:
          KEYSTORE_PATH: "release.keystore"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'lockin_release_storepass' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'lockin' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'lockin_release_keypass' }}
        run: gradle assembleRelease --stacktrace

      - name: Verify Release APK Generated
        run: |
          if [ ! -f "app/build/outputs/apk/release/app-release.apk" ]; then
            echo "::error::Signed Release APK was not generated at app/build/outputs/apk/release/app-release.apk"
            exit 1
          fi
          echo "Production Release APK generated successfully:"
          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LOCKIN-Lite-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Build Debug APK (For Testing)
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LOCKIN-Lite-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
